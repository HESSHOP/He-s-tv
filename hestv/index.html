<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">

<style>
:root{--bg:#0e0e10;--card:#1a1a1e;--red:#d32f2f;--mut:#9a9a9f;--line:#2e2e33;--txt:#fff}

body{display:grid;place-items:center}
#app{width:100%;max-width:400px;height:100%;max-height:840px;background:var(--bg);position:relative;overflow:hidden}

.scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 26px 30px;text-align:center;opacity:0;visibility:hidden;transform:translateX(28px);transition:.3s;overflow-y:auto}
.scr.on{opacity:1;visibility:visible;transform:none}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:32px;letter-spacing:.5px}.logo svg{width:44px;height:44px}
svg{stroke:var(--red);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}svg .f{fill:var(--red);stroke:none}
.ill{width:190px;height:190px;filter:drop-shadow(0 8px 24px #d32f2f55)}
h2{font-size:23px;margin:20px 0 10px}p{color:var(--mut);font-size:14px;line-height:1.5;max-width:285px}
.dots{display:flex;gap:8px;margin-top:32px}.dots i{width:7px;height:7px;border-radius:50%;background:#444}.dots i.a{background:var(--red);width:20px;border-radius:4px}
.ld i{animation:p 1.2s infinite}.ld i:nth-child(2){animation-delay:.2s}.ld i:nth-child(3){animation-delay:.4s}.ld i:nth-child(4){animation-delay:.6s}@keyframes p{50%{background:var(--red)}}
.nav{position:absolute;bottom:24px;right:18px;display:none;z-index:5;font-size:14px}.nav button{background:none;border:0;color:var(--mut);font:inherit;padding:10px;cursor:pointer}.nav .nx{color:var(--txt);font-weight:600}
.back{position:absolute;top:20px;left:16px;width:34px;height:34px;border-radius:50%;background:var(--card);border:0;color:var(--txt);font-size:20px;cursor:pointer;z-index:6}
.btn{width:100%;height:50px;border-radius:10px;border:0;background:var(--red);color:#fff;font-size:16px;font-weight:600;cursor:pointer;margin-top:14px;transition:.15s}.btn:active{transform:scale(.97)}.btn.o{background:transparent;border:1.5px solid #555}
.btn.sm{height:38px;font-size:13px;margin:0;border-radius:8px}.btn.w{background:var(--txt);color:var(--bg)}.btn.g{background:#2a2a2f}
.collage{position:absolute;top:0;left:0;right:0;height:62%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;transform:rotate(-6deg) scale(1.3);transform-origin:top;mask-image:linear-gradient(#000 40%,transparent 95%)}
.collage img{width:100%;height:100%;object-fit:cover;border-radius:8px;background:var(--card)}
.top{justify-content:flex-start}
.form{width:100%;text-align:left;margin-top:22px}

.fld svg{width:18px;height:18px;stroke-width:2;flex:none}.fld input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:15px;padding:8px 0}.eye{background:none;border:0;color:var(--mut);font-size:12px}
.row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mut);width:100%;margin:-4px 0 4px}.lnk{color:var(--red);cursor:pointer}.chk{display:flex;gap:6px}.chk input{accent-color:var(--red)}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:12.5px;margin:20px 0 14px;width:100%}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
.soc{display:flex;gap:16px}.soc button{width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}.soc svg{width:22px;height:22px;stroke-width:0}.soc path{fill:var(--red)}
.sm{font-size:13px;color:var(--mut);margin-top:20px}
.msg{position:absolute;bottom:80px;left:18px;right:18px;background:var(--card);border-left:4px solid var(--red);padding:12px 14px;border-radius:8px;font-size:13px;transform:translateY(200px);transition:.3s;z-index:60}.msg.s{transform:none}
/* app principale */
.main{justify-content:flex-start;align-items:stretch;text-align:left;padding:0 0 74px}
.hd{display:flex;justify-content:space-between;align-items:center;padding:22px 16px 8px}.hd .logo{font-size:17px;gap:5px}.hd .logo svg{width:24px;height:24px}
.ic{width:24px;height:24px;stroke-width:2}.tabs{display:flex;gap:8px;padding:6px 16px}
.tabs button{background:none;border:1px solid #444;color:var(--mut);border-radius:6px;padding:6px 12px;font-size:12px}.tabs .a{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.hero{margin:8px 16px;border-radius:16px;overflow:hidden;position:relative;aspect-ratio:2/2.6;background:var(--card)}.hero img{width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,#000c)}.hero b{color:#fff;position:absolute;bottom:12px;left:14px;font-size:20px;z-index:2;right:14px}
.acts{display:flex;gap:10px;padding:0 16px}.acts .btn{flex:1}
h3{font-size:16px;margin:16px 16px 8px}
.rowx{display:flex;gap:10px;overflow-x:auto;padding:0 16px;scrollbar-width:none}.rowx img{height:130px;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:var(--card);flex:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}.grid img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:var(--card)}
.sb{display:flex;align-items:center;gap:8px;margin:24px 16px 10px;background:var(--card);border-radius:10px;padding:10px 12px}.sb input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:14px}
.li{display:flex;gap:12px;padding:8px 16px;align-items:center}.li img{width:78px;height:96px;object-fit:cover;border-radius:10px;background:var(--card)}.li small{color:var(--mut);display:block;margin:2px 0}.stars{color:var(--red);font-size:12px}
.wide{margin:0 16px 16px;position:relative;border-radius:12px;overflow:hidden}.wide img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--card)}
.pl{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:#000a;border:2px solid #fff;display:grid;place-items:center}.pl:after{content:"";border-left:14px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.tb{position:absolute;bottom:0;left:0;right:0;height:66px;background:color-mix(in srgb,var(--card) 78%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:none;justify-content:space-around;align-items:center;z-index:20}
.tb button{background:none;border:0;color:var(--mut);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}.tb svg{width:22px;height:22px;stroke:currentColor;stroke-width:2}.tb .a{color:var(--red)}
.pav{width:84px;height:84px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:34px;font-weight:700;margin:6px auto}
#pl{position:absolute;inset:0;background:#000;z-index:50;display:none;flex-direction:column;padding-top:40px}#pl iframe{width:100%;aspect-ratio:16/9;border:0}#pl button{align-self:flex-end;margin:10px;background:var(--red);border:0;color:#fff;border-radius:8px;padding:8px 14px}

#app:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(var(--red),transparent 65%);opacity:.2;top:-180px;left:-120px;animation:fl 9s ease-in-out infinite alternate;pointer-events:none}
@keyframes fl{to{transform:translate(160px,120px) scale(1.2)}}
.ill{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-10px)}}
.scr.on>*{animation:up .5s both}@keyframes up{from{opacity:0;translate:0 14px}}
.btn:not(.o):not(.g):not(.w){background:linear-gradient(135deg,var(--red),color-mix(in srgb,var(--red) 55%,#000));box-shadow:0 8px 24px color-mix(in srgb,var(--red) 45%,transparent);position:relative;overflow:hidden}
.btn:not(.o):not(.g):not(.w):after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,#fff5,transparent);transform:skewX(-20deg);animation:sh 3s infinite}@keyframes sh{to{left:130%}}
.lm{display:grid;place-items:center;width:1.05em;height:1.05em;background:linear-gradient(145deg,color-mix(in srgb,var(--red) 65%,#fff),var(--red) 45%,color-mix(in srgb,var(--red) 50%,#000));border-radius:.2em;box-shadow:inset 0 1px 1px #fff9,0 4px 14px color-mix(in srgb,var(--red) 55%,transparent);color:#fff;margin-right:-5px}
.logo{gap:0}
.collage{display:flex;gap:8px}.col{flex:1;display:flex;flex-direction:column;gap:8px;animation:mq 30s linear infinite}.col:nth-child(2){animation-direction:reverse;animation-duration:36s}

.cb{position:absolute;top:0;left:0;right:0;height:52%;opacity:.55;filter:grayscale(1);mask-image:linear-gradient(#000 30%,transparent)}
.badge{width:84px;height:84px;border-radius:50%;background:color-mix(in srgb,var(--red) 22%,var(--card));display:grid;place-items:center;box-shadow:0 0 40px color-mix(in srgb,var(--red) 50%,transparent);animation:bob 4s ease-in-out infinite}.badge svg{width:52px;height:52px;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.seg{display:flex;margin:0 16px;background:var(--card);border-radius:10px;padding:4px}.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px;border-radius:8px}.seg .a{background:var(--red);color:#fff}
.it{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-size:14px}.it span{color:var(--mut)}
.tg{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:.2s;flex:none}.tg:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--red)}.tg.on:after{left:21px}
.cl{width:52px;height:52px;border-radius:14px;background:linear-gradient(145deg,var(--red),color-mix(in srgb,var(--red) 40%,#000));display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--red) 40%,transparent);flex:none}
.lv{color:#fff;background:var(--red);font-size:10px;padding:3px 7px;border-radius:5px;animation:bl 1.4s infinite;white-space:nowrap}@keyframes bl{50%{opacity:.5}}
.hb{display:flex;align-items:center;gap:10px;padding:22px 16px 10px}.hb b{flex:1;font-size:18px}.bk{background:none;border:0;color:var(--txt);font-size:30px;line-height:1;padding:0 6px;cursor:pointer}
.pc{position:relative;flex:none;border-radius:10px;overflow:hidden;background:var(--card);cursor:pointer;transition:transform .2s}.pc:active{transform:scale(.95)}.rowx .pc{height:150px;aspect-ratio:2/3}.pc img{width:100%;height:100%;object-fit:cover;display:block}.grid .pc{aspect-ratio:2/3}.pc img.bad,.hero img.bad,.wi img.bad{visibility:hidden}
.pl.s{width:28px;height:28px;border-width:1.5px;top:auto;left:auto;right:6px;bottom:6px;transform:none}.pl.s:after{border-left-width:9px;border-top-width:5px;border-bottom-width:5px;margin-left:2px}
.sk{background:linear-gradient(90deg,var(--card) 25%,color-mix(in srgb,var(--card) 70%,var(--txt)) 50%,var(--card) 75%);background-size:200% 100%;animation:shm 1.3s infinite;border-radius:10px;flex:none;height:150px;aspect-ratio:2/3}.hero.sk{height:auto;aspect-ratio:2/2.6}.grid .sk{height:auto;width:100%}@keyframes shm{to{background-position:-200% 0}}
.hero .hi{position:absolute;inset:0;opacity:0;transition:opacity .9s}.hero .hi.on{opacity:1}
.gs{background:none;border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit}.gs option{color:#000}
.chips{display:flex;gap:6px;padding:4px 0;flex-wrap:wrap}.chips span{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:11px;color:var(--mut)}
.wi{position:relative}.wi img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:12px;background:var(--card)}.wm{padding-top:8px}.ov{font-size:12px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:4px;max-width:none}
.rt{padding:40px 16px;text-align:center;color:var(--mut)}
.pt{display:flex;justify-content:space-around;border-bottom:1px solid var(--line);margin:8px 0}.pt button{background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:10px 6px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}.pt .a{color:var(--txt);border-color:var(--red)}.pt svg{width:18px;height:18px;stroke-width:2}
.nav .nx{border:1px solid var(--line);border-radius:4px;padding:6px 14px;margin-right:6px}.nav button{font-size:13px}
.ld i:nth-child(5){animation-delay:.8s}.ld i:nth-child(6){animation-delay:1s}.ld i:nth-child(7){animation-delay:1.2s}
</style></head><body>

<div id="screens"></div>

<script>
/* ===== CONFIG ===== */
const TMDB_TOKEN="eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiJhNWI5YmI2YjJiYTUyOTc1ZTJiZGQyN2U5Y2QxM2FjZSIsIm5iZiI6MTc5Mjc3OTA1OC45MTUsInN1YiI6IjZhZGJhMzMyMTBjODNmOTcwOGZlNGJjNCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.ymJ9CDY5Ty6nvh5pvcjwh-bVZpfiphjjr4IUvn16Wm4";

const T=async(p,n=2)=>{try{const r=await fetch('https://api.themoviedb.org/3'+p+(p.includes('?')?'&':'?')+'language=fr-FR',{headers:{Authorization:'Bearer '+TMDB_TOKEN}});if(!r.ok)throw 0;return await r.json()}catch(e){return n>1?T(p,n-1):{results:[]}}};

const reel=(c='')=>{let h='';for(let i=0;i<6;i++){const a=i*Math.PI/3;h+=`<circle cx="${50+24*Math.cos(a)}" cy="${50+24*Math.sin(a)}" r="9" fill="url(#g)" stroke="#000" stroke-width="1.5"/>`}

const logo=()=>`<div class="logo"><b class="lm">H</b><span>E'S&nbsp;TV</span></div>`;
const em='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',lk='<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',us='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',ph='<svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg>';
const fld=(id,i,pl,t='text',e='')=>`<label class="fld">${i}<input id="${id}" type="${t}" placeholder="${pl}">${e?'<button class="eye" onclick="eye(this)">Voir</button>':''}</label>`;
const dots=n=>`<div class="dots">${[0,1,2,3].map(i=>`<i class="${i==n?'a':''}"></i>`).join('')}</div>`;
const ob=(id,back,svg,h,t,n)=>`<section class="scr" id="${id}">${back?`<button class="back" onclick="go('${back}')">‹</button>`:''}${svg}<h2>${h}</h2><p>${t}</p>${dots(n)}</section>`;
const soc=`<div class="soc"><button><svg viewBox="0 0 24 24"><path d="M14 9V7c0-1 .5-1.500 1.500-1.500H17V2h-3c-3 0-4.500 2-4.500 4.500V9H7v3.500h2.500V22H14v-9.500h2.800L17.500 9z"/></svg></button><button><svg viewBox="0 0 24 24"><path d="M16.500 12.500c0-2 1.600-3 1.700-3.100-1-1.400-2.400-1.600-2.900-1.600-1.200-.1-2.400.7-3 .7s-1.600-.7-2.600-.7c-1.400 0-2.600.8-3.300 2-1.400 2.400-.4 6 1 8 .7 1 1.400 2 2.500 2s1.400-.6 2.600-.6 1.600.6 2.600.6 1.700-1 2.400-2c.8-1.100 1.100-2.200 1.100-2.300-.1 0-2.100-.8-2.100-3zM14.600 6.500c.5-.7.900-1.600.8-2.500-.8 0-1.700.5-2.300 1.200-.5.600-.9 1.500-.8 2.400.9.100 1.800-.4 2.300-1.100z"/></svg></button><button><svg viewBox="0 0 24 24"><path d="M21 12.200c0-.7-.1-1.300-.2-1.900H12v3.600h5c-.2 1.200-.9 2.200-1.900 2.800v2.300h3.100c1.800-1.700 2.800-4.100 2.800-6.800zM12 21.500c2.600 0 4.700-.9 6.300-2.300l-3.100-2.300c-.9.600-2 .9-3.200.9-2.500 0-4.600-1.700-5.300-3.900H3.500v2.400c1.600 3.100 4.800 5.200 8.500 5.200zM6.700 13.900a5.700 5.700 0 010-3.700V7.800H3.500a9.500 9.500 0 000 8.500z"/></svg></button></div>`;
const rocket='<svg class="ill" viewBox="0 0 100 100"><path d="M50 8c10 12 12 30 8 46H42c-4-16-2-34 8-46z"/><circle class="f" cx="50" cy="34" r="5"/><path d="M42 54l-10 14 12-3M58 54l10 14-12-3M50 62v14M20 90h60"/></svg>';
const phone='<svg class="ill" viewBox="0 0 100 100"><rect x="28" y="8" width="44" height="84" rx="7"/><path d="M36 30h28M36 44h28M36 58h18"/><path class="f" d="M42 74l12 6-12 6z"/></svg>';
const clap='<svg class="ill" viewBox="0 0 100 100"><path d="M12 38h76v48H12z"/><path d="M12 38l6-16 66-8 4 10M30 30l8-12M52 26l8-12M72 22l8-12"/><circle class="f" cx="50" cy="62" r="9"/></svg>';
const mail='<svg class="ill" viewBox="0 0 100 100"><rect x="12" y="26" width="76" height="52" rx="6"/><path d="M12 30l38 28 38-28"/><circle class="f" cx="80" cy="26" r="9"/></svg>';
const key='<svg class="ill" viewBox="0 0 100 100"><circle cx="34" cy="50" r="18"/><circle class="f" cx="34" cy="50" r="6"/><path d="M52 50h38M76 50v12M66 50v8"/></svg>';
const S=[];
S.push(`<section class="scr on ld" id="s1">${logo()}<div class="dots"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></section>`);

 u=u.slice(0,18);const c=[0,1,2].map(i=>u.filter((_,k)=>k%3===i));$('#col').innerHTML=c.map(a=>`<div class="col">${[...a,...a].map(s=>`<img src="${s}">`).join('')}</div>`).join('')}
