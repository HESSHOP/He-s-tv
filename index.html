/* Bouton ? déplaçable (position mémorisée) */
(function(){const b=$('#hlpb'),app=$('#app');let d=null,moved=false;
 function place(x,y){const r=app.getBoundingClientRect();x=Math.max(4,Math.min(r.width-b.offsetWidth-4,x));y=Math.max(4,Math.min(r.height-b.offsetHeight-4,y));b.style.left=x+'px';b.style.top=y+'px';b.style.right='auto';return[x,y]}
 try{const p=JSON.parse(localStorage.getItem('hbpos'));if(p)place(p[0],p[1])}catch(e){}
 b.addEventListener('pointerdown',e=>{const r=b.getBoundingClientRect();d={dx:e.clientX-r.left,dy:e.clientY-r.top,sx:e.clientX,sy:e.clientY};moved=false;b.setPointerCapture(e.pointerId)});
 b.addEventListener('pointermove',e=>{if(!d)return;if(!moved&&Math.hypot(e.clientX-d.sx,e.clientY-d.sy)<6)return;moved=true;const r=app.getBoundingClientRect();place(e.clientX-r.left-d.dx,e.clientY-r.top-d.dy)});
 b.addEventListener('pointerup',e=>{if(!d)return;d=null;if(moved){try{localStorage.setItem('hbpos',JSON.stringify([parseFloat(b.style.left),parseFloat(b.style.top)]))}catch(x){}}else openHp()});
 b.addEventListener('pointercancel',()=>{d=null});
 addEventListener('resize',()=>{if(b.style.left)place(parseFloat(b.style.left),parseFloat(b.style.top))});
})();
